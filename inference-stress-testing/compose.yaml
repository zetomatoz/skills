services:
  runner:
    image: ${GUIDELLM_IMAGE:-ghcr.io/vllm-project/guidellm:v0.8.0}
    entrypoint: ["python", "/work/scripts/run.py"]
    command: ["run"]
    working_dir: /work
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    volumes:
      - .:/work
    environment:
      HF_HOME: /work/.cache/huggingface
    extra_hosts:
      - host.docker.internal:host-gateway
    cpus: ${RUNNER_CPUS:-2}
    mem_limit: ${RUNNER_MEMORY:-4g}
    init: true
  evaluate:
    image: ${EVAL_IMAGE:-python:3.12-slim}
    profiles: [tools]
    entrypoint: ["python", "/work/scripts/evaluate.py"]
    working_dir: /work
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    volumes:
      - .:/work
  ray:
    image: ${EVAL_IMAGE:-python:3.12-slim}
    profiles: [tools]
    entrypoint: ["python", "/work/scripts/ray_tune.py"]
    working_dir: /work
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    volumes:
      - .:/work
    extra_hosts:
      - host.docker.internal:host-gateway
