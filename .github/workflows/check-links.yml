name: Check repository references
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML>=6,<7'
      - run: python3 scripts/check_links.py --external
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s inference-stress-testing/tests -v
      - run: python3 -m unittest discover -s ray-autotune-inference/tests -v
      - run: python3 -m unittest discover -s inference-observability/tests -v
      - run: python3 -m unittest discover -s inference-optimization/tests -v
